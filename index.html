<style>

  form{display:flex;flex-direction:column;gap:10px}
  input{font:inherit;font-size:1.1rem;letter-spacing:.3em;text-align:center;padding:12px 14px;border:1px solid var(--border);
        border-radius:10px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
  input:focus{border-color:var(--accent)}
  button{font:inherit;font-weight:700;font-size:.92rem;padding:12px;border:0;border-radius:10px;background:var(--accent);
         color:#fff;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.9}
  button:disabled{opacity:.6;cursor:default}
  .err{color:#dc2626;font-size:.8rem;min-height:1em;margin-top:2px}
  .foot{font-size:.7rem;color:var(--sub);margin-top:18px;line-height:1.5}
</style>

  <script>
  (function(){
    var P = JSON.parse(document.getElementById('payload').textContent);
    var f=document.getElementById('f'), pw=document.getElementById('pw'),
        err=document.getElementById('err'), btn=document.getElementById('btn');
    function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
    f.addEventListener('submit', function(e){
      e.preventDefault(); err.textContent=''; btn.disabled=true; btn.textContent='여는 중…';
      var enc=new TextEncoder();
      crypto.subtle.importKey('raw', enc.encode(pw.value), 'PBKDF2', false, ['deriveKey'])
      .then(function(bk){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2', salt:b64(P.salt), iterations:P.it, hash:'SHA-256'},
          bk, {name:'AES-GCM', length:256}, false, ['decrypt']);
      })
      .then(function(key){
        return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
      })
      .then(function(buf){
        var html=new TextDecoder().decode(buf);
        document.open(); document.write(html); document.close();
      })
      .catch(function(){
